name: iOS IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Generate iOS Runner
        run: bash tooling/ios/bootstrap.sh
      - name: Build IPA
        run: |
          cd app
          flutter build ipa --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-ios-ipa
          path: app/build/ios/ipa/*.ipa
          if-no-files-found: error
